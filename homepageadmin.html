<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trippin' - Admin Account Page</title>
    <link rel="stylesheet" href="homepageadmin.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Trippin'</h1>
      <h2 class="subtitle">Admin Account Page</h2>
      <h3 id="companyname">Blank Ltd</h3>
    </header>
    <main>
      <div class="elements" onclick="change()">Edit company name</div>
      <br />
      <div class="elements" onclick="editPassword()">Edit Password</div>
      <br />

      <div id="earnings" class="elements" onclick="displayEarnings()">
        <label>Earnings:</label>
      </div>
      <br />

      <div class="elements" id="withdraw" onclick="withdraw()">Withdraw</div>
      <br />
      <div id="delete" class="elements" onclick="deleteaccount()">
        Delete Account
      </div>
      <br />
      <div id="logout" class="elements" onclick="logout()">Log Out</div>
    </main>

    <div id="alertModal" class="modal">
      <div class="modal-content">
        <span class="close-button" onclick="closeModal()">×</span>
        <p id="modalMessage"></p>
      </div>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
