<!DOCTYPE html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trippin' - User homepage</title>
    <link rel="stylesheet" href="styledd.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="title">Trippin'</h1>
      <h2 class="subtitle">Search for your next trip</h2>
    </header>
    <main>
      <section class="search-section">
        <form class="form" action="#" method="get">
          <label for="searchquery">Enter destination or travel package:</label>
          <div class="input-container">
            <input
              type="text"
              name="searchquery"
              id="searchquery"
              placeholder="Camp Ndunda or Kirinyaga"
              required
            />
            <button type="submit">
              <i class="fas fa-search"></i>
              <!-- Correcting the icon class -->
            </button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
